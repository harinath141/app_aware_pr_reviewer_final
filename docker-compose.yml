services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: reviewer
      POSTGRES_USER: reviewer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewer -d reviewer"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [internal]
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://reviewer:${POSTGRES_PASSWORD:-change-me}@db:5432/reviewer
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal]
volumes:
  pgdata:
networks:
  internal:
    driver: bridge
